# Configuração do SonarCloud para o projeto DevSecOps Demo
# Docs: https://docs.sonarcloud.io/enriching/analysis/parameters/

# --- IMPORTANTE: Substituir estes valores pelo teu próprio organização/chave ---
# 1. Criar conta em https://sonarcloud.io
# 2. Importar o repositório GitHub
# 3. Copiar a organization e projectKey do painel do SonarCloud

sonar.organization=01RodrigoHenriques
sonar.projectKey=01RodrigoHenriques_devsecops-pipeline
# Diretoria com o código fonte a analisar
sonar.sources=app/src

# Excluir node_modules da análise
sonar.exclusions=**/node_modules/**

# Configurações de codificação
sonar.sourceEncoding=UTF-8

# Linguagens detetadas automaticamente, mas podemos forçar
sonar.language=js
