# Configuração SonarCloud — Projeto DevSecOps Pipeline
# Docs: https://docs.sonarcloud.io/enriching/analysis/parameters/

# Organização SonarCloud (deve corresponder EXATAMENTE ao valor no painel)
sonar.organization=01rodrigohenriques

# Chave do projeto (formato: <org>_<repo>)
sonar.projectKey=01RodrigoHenriques_devsecops-pipeline

# Diretoria com o código fonte a analisar
sonar.sources=app/src

# Excluir node_modules da análise
sonar.exclusions=**/node_modules/**

# Codificação
sonar.sourceEncoding=UTF-8

# Linguagem (JavaScript/TypeScript é auto-detectada, mas explicitamos)
sonar.language=js
